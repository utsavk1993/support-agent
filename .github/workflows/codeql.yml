name: CodeQL

# Deliberately NOT filtered by path, unlike the backend and frontend
# workflows. The branch ruleset requires a code scanning result before a
# merge, and a check that is skipped never reports — so filtering this one
# would block every pull request that happened not to touch the filter.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-scan. Existing code can become vulnerable without changing,
    # when a new class of vulnerability is discovered after it was written.
    # Off-peak and off the hour, to avoid the crowd every cron job joins.
    - cron: "23 4 * * 2"

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The client is now a real TypeScript application that renders model
        # output as HTML, so it is worth scanning rather than only the API.
        language: [python, javascript-typescript]

    permissions:
      actions: read
      contents: read
      security-events: write   # needed to upload results to the Security tab

    steps:
      - uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Neither language needs a build step: CodeQL reads the source
          # directly. Compiled languages would need one here so it can watch
          # the compiler.
          #
          # To widen coverage beyond security defaults, add:
          #   queries: security-extended,security-and-quality

      - name: Analyse
        uses: github/codeql-action/analyze@v3
