name: Backend

# Only runs when something the Python application depends on changes.
# A CSS tweak in web/ has no way of breaking pytest, and starting a Postgres
# container to prove that wastes a minute of everybody's time.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "migrations/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/backend.yml"

jobs:
  # The job key becomes the check name: "Backend / verify".
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Needed to post the coverage table onto the pull request. Granted
      # here rather than to the whole workflow, so only this job has it.
      pull-requests: write

    env:
      # The model client is built at import time and refuses to exist without
      # a key, so CI needs *a* value. Nothing here makes a real API call —
      # the model is stubbed — so a placeholder is enough and no secret is
      # configured.
      NVIDIA_API_KEY: dummy-key-not-used-in-tests
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/support_test
      SECRET_KEY: not-a-real-secret-only-signs-test-cookies

    services:
      # A real Postgres, started by GitHub for the life of this job and
      # thrown away afterwards. Tests run against the same database engine
      # as production rather than a stand-in, which is the only way to catch
      # the things that differ between them.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: support_test
        ports:
          - 5432:5432
        # Without this, the job races a database that is still starting.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        # --check reports what differs without rewriting anything, so CI
        # fails on unformatted code rather than quietly fixing it and
        # leaving the branch different from what was reviewed.
        run: ruff format --check .

      - name: Test
        # The 100% threshold lives in pyproject.toml, so running the suite
        # locally enforces exactly what CI does. Below 100 this fails, and
        # the two steps after it still run because of `if: always()` — a
        # report is most useful when something is wrong.
        run: pytest -q --cov --cov-report=term --cov-report=html --cov-report=json

      - name: Build the coverage table
        if: always()
        # One table, written to a file, then used twice: on the run's
        # summary page and as a comment on the pull request.
        run: |
          python - <<'PY' > coverage-table.md
          import json, pathlib

          # A hidden marker, so the next run can find this comment and edit
          # it instead of adding another one.
          print("<!-- coverage:backend -->")

          report = pathlib.Path("coverage.json")
          if not report.is_file():
              print("### Backend coverage\n\nThe test run produced no report.")
              raise SystemExit

          data = json.loads(report.read_text())
          total = data["totals"]["percent_covered_display"]
          ok = total == "100"

          print(f"### Backend coverage — {'✅' if ok else '❌'} {total}%\n")
          if not ok:
              print("Below the 100% this project requires.\n")

          print("| File | Coverage | Uncovered lines |")
          print("|---|--:|---|")
          for name, file in sorted(data["files"].items()):
              pct = file["summary"]["percent_covered_display"]
              missing = file["missing_lines"]
              shown = ", ".join(map(str, missing[:8])) + ("…" if len(missing) > 8 else "")
              mark = "" if pct == "100" else " ⚠️"
              print(f"| `{name}` | {pct}%{mark} | {shown or '—'} |")
          PY

          cat coverage-table.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request'
        # Edits its own previous comment rather than adding a new one each
        # push, so a busy pull request does not fill up with stale tables.
        #
        # Skipped for pull requests from forks, where the token is
        # read-only and posting would fail.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          existing=$(gh api "repos/$REPO/issues/$PR/comments" \
            --jq 'map(select(.body | contains("<!-- coverage:backend -->"))) | .[0].id // empty')

          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" \
              -F body=@coverage-table.md > /dev/null
            echo "updated comment $existing"
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" \
              -F body=@coverage-table.md > /dev/null
            echo "posted a new comment"
          fi

      - name: Keep the full report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          # The browsable HTML version, for when the summary is not enough
          # to see which line is uncovered.
          path: htmlcov/
          retention-days: 14

      - name: Check the app actually starts
        # Lint and tests both run against imported code. This catches the
        # case where everything imports fine but the app dies on startup —
        # a bad migration, a missing setting, a broken lifespan.
        #
        # It asks for a conversation that does not exist, rather than the
        # page: that exercises routing, the session cookie and the database,
        # and needs no built client. Expecting 404 also proves the app is
        # answering rather than merely listening.
        run: |
          uvicorn app.main:app --port 8000 &
          for _ in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:8000/api/conversations/x && break
            sleep 0.5
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8000/api/conversations/11111111-2222-3333-4444-555555555555)
          test "$code" = "404" || { echo "expected 404, got $code"; exit 1; }
          echo "app started and answered correctly"
