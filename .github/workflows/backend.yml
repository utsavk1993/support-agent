name: Backend

# Only runs when something the Python application depends on changes.
# A CSS tweak in web/ has no way of breaking pytest, and starting a Postgres
# container to prove that wastes a minute of everybody's time.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "migrations/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/backend.yml"

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # The model client is built at import time and refuses to exist without
      # a key, so CI needs *a* value. Nothing here makes a real API call —
      # the model is stubbed — so a placeholder is enough and no secret is
      # configured.
      NVIDIA_API_KEY: dummy-key-not-used-in-tests
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/support_test
      SECRET_KEY: not-a-real-secret-only-signs-test-cookies

    services:
      # A real Postgres, started by GitHub for the life of this job and
      # thrown away afterwards. Tests run against the same database engine
      # as production rather than a stand-in, which is the only way to catch
      # the things that differ between them.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: support_test
        ports:
          - 5432:5432
        # Without this, the job races a database that is still starting.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Check the app actually starts
        # Lint and tests both run against imported code. This catches the
        # case where everything imports fine but the app dies on startup —
        # a bad migration, a missing setting, a broken lifespan.
        #
        # It asks for a conversation that does not exist, rather than the
        # page: that exercises routing, the session cookie and the database,
        # and needs no built client. Expecting 404 also proves the app is
        # answering rather than merely listening.
        run: |
          uvicorn app.main:app --port 8000 &
          for _ in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:8000/api/conversations/x && break
            sleep 0.5
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8000/api/conversations/11111111-2222-3333-4444-555555555555)
          test "$code" = "404" || { echo "expected 404, got $code"; exit 1; }
          echo "app started and answered correctly"
