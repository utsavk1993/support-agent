name: CI

# Run on every push to main, and on every pull request targeting it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # The client is constructed at import time and refuses to build without
      # a key, so CI needs *a* value here. Nothing in the test suite makes a
      # real API call — the model is stubbed out — so a placeholder is enough
      # and no real secret is needed.
      NVIDIA_API_KEY: dummy-key-not-used-in-tests
      # Points at the service container below, not a hosted database.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/support_test
      SECRET_KEY: not-a-real-secret-only-signs-test-cookies

    services:
      # A real Postgres, started by GitHub for the life of this job and
      # thrown away afterwards. Tests run against the same database engine
      # as production rather than a stand-in, which is the only way to catch
      # the things that differ between them.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: support_test
        ports:
          - 5432:5432
        # Without this, the job races a database that is still starting.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Check the app actually starts
        # Lint and tests both run against imported code. This catches the
        # case where the app imports fine but dies on startup.
        run: |
          uvicorn main:app --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/ > /dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8000/ > /dev/null
          echo "app served the page successfully"
