<!DOCTYPE html>
<!--
  index.html — the chat window.

  Deliberately plain: one file, no build step, no framework. Most of the
  interesting work happens in main.py.

  The one thing worth understanding here is the `conversation` array in the
  script below. That array IS the memory of this chat. The model remembers
  nothing between requests, and neither does the server — so refreshing this
  page loses the conversation.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind Support</title>

<!--
  marked      turns the model's markdown (**bold**, lists) into HTML.
  DOMPurify   strips anything dangerous from that HTML before we insert it.

  DOMPurify is not optional. The model's reply is not trusted input: a
  customer can write anything into the chat, and the model can be talked
  into repeating it. If that reached innerHTML unchecked, a message
  containing <img src=x onerror="..."> would run their script in our page.
  DOMPurify removes that while leaving normal formatting alone.

  Never write your own HTML sanitiser. This is a problem with a very long
  tail of edge cases, and a well-tested library is the only sane answer.
-->
<script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f7f9; --border: #e3e6ea;
    --text: #1a1d21; --muted: #6b7280;
    --user: #2563eb; --user-text: #ffffff;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --panel: #1e2126; --border: #2c3036;
      --text: #e6e8ea; --muted: #9aa1ab;
      --user: #3b82f6; --user-text: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header span { color: var(--muted); font-size: 13px; }

  #chat { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }

  .msg { margin-bottom: 14px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    padding: 10px 14px; border-radius: 14px; max-width: 78%;
    word-wrap: break-word;
  }
  /* The customer's own message is plain text, so their line breaks have to
     survive. The assistant's reply is HTML, where newlines between tags are
     just formatting — leaving pre-wrap on would render every one of them as
     a blank line, which is what made replies look so airy. */
  .user .body { white-space: pre-wrap; }
  .user .bubble { background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .assistant .bubble { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

  .meta { font-size: 11px; color: var(--muted); margin-top: 5px; }

  /* The model's formatted reply. Margins are trimmed so a single
     paragraph does not sit in a pool of empty space. */
  .body > *:first-child { margin-top: 0; }
  .body > *:last-child { margin-bottom: 0; }
  .body p { margin: 0 0 8px; }
  .body ul, .body ol { margin: 0 0 8px; padding-left: 22px; }
  .body li { margin: 0; }
  /* The model leaves blank lines between bullets, which markdown treats as
     a "loose" list and wraps each item in its own paragraph. Those carry a
     bottom margin that stacks with the list spacing, so we flatten them. */
  .body li > p { margin: 0; }
  .body li + li { margin-top: 5px; }
  .body li > ul, .body li > ol { margin: 4px 0 0; }
  .body code { background: rgba(127,127,127,.18); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .body pre { background: rgba(127,127,127,.14); padding: 10px; border-radius: 8px; overflow-x: auto; }
  .body pre code { background: none; padding: 0; }
  .body h1, .body h2, .body h3 { font-size: 15px; margin: 10px 0 6px; }
  .body table { border-collapse: collapse; margin: 4px 0 8px; }
  .body th, .body td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }

  /* The model's reasoning, folded away by default. */
  details.thinking { margin-bottom: 8px; font-size: 12px; color: var(--muted); }
  details.thinking summary {
    cursor: pointer; user-select: none; list-style: none;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 999px;
    background: rgba(127,127,127,.14);
  }
  details.thinking summary::-webkit-details-marker { display: none; }
  details.thinking[open] summary { margin-bottom: 6px; }
  .thinking-body {
    white-space: pre-wrap; padding: 8px 11px; border-radius: 8px;
    background: rgba(127,127,127,.09); border-left: 2px solid var(--border);
    max-height: 220px; overflow-y: auto; line-height: 1.5;
  }
  /* A gentle pulse while the model is still working. */
  .pulse { animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
  .empty { color: var(--muted); text-align: center; padding: 40px 16px; }
  .empty code { background: var(--panel); padding: 2px 6px; border-radius: 4px; }

  footer { border-top: 1px solid var(--border); padding: 12px 16px; }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  input {
    flex: 1; padding: 11px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font: inherit; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    padding: 11px 20px; border-radius: 10px; border: none;
    background: var(--accent); color: #fff; font: inherit; font-weight: 500;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>

<header>
  <h1>Northwind Tools — Support</h1>
  <span>Returns · Warranty · Shipping · Price matching</span>
</header>

<div id="chat">
  <div class="wrap" id="messages">
    <div class="empty" id="empty">
      Ask about returns, warranties, shipping or price matching.<br>
      Try: <code>What's the restocking fee on a used power tool?</code>
    </div>
  </div>
</div>

<footer>
  <form id="form">
    <input id="input" placeholder="Type your question…" autocomplete="off" autofocus>
    <button id="send" type="submit">Send</button>
  </form>
</footer>

<script>
// ---------------------------------------------------------------------------
// THE CONVERSATION
// ---------------------------------------------------------------------------
// The messages themselves live on the server now. All the browser keeps is
// the id of the conversation it is in, so it can say which one to continue
// after a refresh.
//
// The model still remembers nothing between messages — the server reloads
// the history from the database and sends it every time. What changed is
// who holds that history, not whether it gets sent.
let conversationId = localStorage.getItem("conversationId");

const messagesEl = document.getElementById("messages");
const emptyEl    = document.getElementById("empty");
const formEl     = document.getElementById("form");
const inputEl    = document.getElementById("input");
const sendEl     = document.getElementById("send");

// Draw one message bubble on screen.
// `meta` is the small grey line underneath — we use it for token counts.
// Draw one message bubble.
//
// The bubble is split into three parts, because each holds a different kind
// of content and they arrive at different times:
//
//   thinking  the model's reasoning, folded away  (assistant only)
//   body      the reply itself
//   meta      the token counts, once it finishes
//
// Keeping them separate means writing the reply does not wipe out the rest.
function addBubble(role, text) {
  if (emptyEl) emptyEl.remove();            // clear the placeholder once

  const row = document.createElement("div");
  row.className = "msg " + role;

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const body = document.createElement("div");
  body.className = "body";
  body.textContent = text;                  // textContent, not innerHTML —
  bubble.appendChild(body);                 // so typed text can't inject HTML

  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollDown();
  return { bubble, body };
}

function scrollDown() {
  document.getElementById("chat").scrollTop = 1e9;
}

// Turn the model's markdown into HTML, safely.
//
// Two steps, and the second one is the important one. marked does the
// formatting; DOMPurify throws away anything that could run code. Skipping
// the purify step would mean any script the model can be persuaded to write
// would execute in our page.
function renderMarkdown(markdown) {
  return DOMPurify.sanitize(marked.parse(markdown));
}

// The token line under a reply. Defined once so a restored conversation
// shows exactly what it showed live, rather than drifting out of step.
function addUsageLine(bubble, usage) {
  const meta = document.createElement("div");
  meta.className = "meta";
  // The provider bills one figure for everything the model wrote, reasoning
  // included, so the thinking share is worked out from how much of the
  // output was reasoning. The ~ marks it as an estimate.
  meta.textContent =
    `${usage.prompt_tokens} in` +
    ` + ~${usage.thinking_tokens} thinking` +
    ` + ~${usage.answer_tokens} answer` +
    ` = ${usage.total_tokens} total`;
  meta.title =
    `Billed: ${usage.prompt_tokens} input + ${usage.completion_tokens} output.\n` +
    `The provider does not separate reasoning from the answer, so that ` +
    `split is estimated from the length of each.`;
  bubble.appendChild(meta);
}

// ---------------------------------------------------------------------------
// RESTORE ON LOAD
// ---------------------------------------------------------------------------
// If we were in a conversation last time, fetch it and draw it again. This
// is the whole point of moving history to the server: closing the tab no
// longer destroys it.
async function restoreConversation() {
  if (!conversationId) return;

  try {
    const res = await fetch(`/api/conversations/${conversationId}`);

    if (!res.ok) {
      // 404 means it is gone, or belongs to someone else — which is what
      // you get after clearing cookies, since identity lives in one.
      // Either way, forget it and start fresh rather than retrying forever.
      localStorage.removeItem("conversationId");
      conversationId = null;
      return;
    }

    const data = await res.json();
    for (const message of data.messages) {
      const { bubble, body } = addBubble(message.role, "");

      // Assistant replies are markdown; what the customer typed is not, and
      // must never be treated as markup.
      if (message.role === "assistant") {
        body.innerHTML = renderMarkdown(message.content);
      } else {
        body.textContent = message.content;
      }

      // Token counts were recorded when the reply was written, so they
      // survive a refresh along with the text.
      //
      // The "Thought for Ns" toggle does not come back: the reasoning is
      // the model's scratchpad and is not stored. It can speculate about a
      // customer, and keeping it would be a liability rather than an asset.
      if (message.usage) addUsageLine(bubble, message.usage);
    }
  } catch {
    // Offline, or the server is down. Leave the page empty rather than
    // showing an error for something the user did not ask for.
  }
}

restoreConversation();

formEl.addEventListener("submit", async (event) => {
  event.preventDefault();                   // don't let the browser reload

  const text = inputEl.value.trim();
  if (!text) return;

  // Show what the user typed. The server records it; we only draw it.
  addBubble("user", text);

  // Lock the form while we wait. Without this you can fire off five
  // requests by mashing Enter, and the replies come back out of order.
  inputEl.value = "";
  inputEl.disabled = true;
  sendEl.disabled = true;

  // An empty bubble to fill in as the reply arrives.
  const { bubble, body } = addBubble("assistant", "");

  // Built lazily, only if the model actually reasons before answering.
  let thinkingBox = null;
  let thinkingText = "";
  const startedAt = performance.now();

  function showThinking(chunk) {
    if (!thinkingBox) {
      thinkingBox = document.createElement("details");
      thinkingBox.className = "thinking";
      thinkingBox.innerHTML =
        '<summary class="pulse">Thinking…</summary><div class="thinking-body"></div>';
      bubble.insertBefore(thinkingBox, body);   // above the reply
    }
    thinkingText += chunk;
    thinkingBox.querySelector(".thinking-body").textContent = thinkingText;
    scrollDown();
  }

  function finishThinking() {
    if (!thinkingBox) return;
    const seconds = ((performance.now() - startedAt) / 1000).toFixed(1);
    const summary = thinkingBox.querySelector("summary");
    summary.textContent = `Thought for ${seconds}s`;
    summary.classList.remove("pulse");         // stop the animation
  }

  try {
    // One message, plus which conversation it belongs to. The server loads
    // the rest — the browser no longer sends the history at all.
    async function post(id) {
      return fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, conversation_id: id }),
      });
    }

    let res = await post(conversationId);

    // A 404 means the server does not recognise this conversation: it was
    // deleted, or the session cookie changed and it now belongs to someone
    // else. The id we are holding is useless.
    //
    // Without this, every later message failed the same way and the chat was
    // stuck for good — the id stayed in localStorage and kept being sent.
    // Forget it and send the message again as a new conversation, so the
    // person can carry on rather than being told "Not found." forever.
    if (res.status === 404 && conversationId) {
      localStorage.removeItem("conversationId");
      conversationId = null;
      res = await post(null);
    }

    // Failures that happen BEFORE the reply starts still arrive as a normal
    // HTTP error, so we can handle them the usual way.
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Server returned ${res.status}`);
    }

    // ---- reading the stream -------------------------------------------
    // The server sends Server-Sent Events: each one is a line beginning
    // "data: " followed by a blank line. They arrive in whatever sized
    // lumps the network feels like, so a single read might contain two
    // events, or half of one. We keep a buffer and only process what is
    // complete.
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let reply = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      // A blank line marks the end of an event. Anything after the last
      // one is a partial event — leave it in the buffer for the next read.
      const events = buffer.split("\n\n");
      buffer = events.pop();

      for (const event of events) {
        if (!event.startsWith("data: ")) continue;
        const piece = JSON.parse(event.slice(6));

        if (piece.type === "conversation") {
          // Arrives first. On a new conversation this is the id the server
          // just created, which we keep so a refresh can pick it back up.
          conversationId = piece.id;
          localStorage.setItem("conversationId", conversationId);

        } else if (piece.type === "thinking") {
          // The model working out what to say, before it says any of it.
          showThinking(piece.text);

        } else if (piece.type === "text") {
          // First real text means the reasoning is over.
          if (!reply) finishThinking();

          reply += piece.text;
          // Re-render the whole reply each time rather than appending.
          // Markdown needs the full text to make sense of it — half of
          // "**bold**" is not bold, it is two asterisks.
          body.innerHTML = renderMarkdown(reply);
          scrollDown();

        } else if (piece.type === "usage") {
          // Token counts arrive once, at the very end.
          finishThinking();
          addUsageLine(bubble, piece);

        } else if (piece.type === "error") {
          // Something broke after the reply had already started. We cannot
          // get a status code at this point, so the server tells us here.
          finishThinking();
          reply += "\n\n⚠️ " + piece.message;
          body.innerHTML = renderMarkdown(reply);
        }
      }
    }

  } catch (error) {
    finishThinking();
    body.textContent = "⚠️ " + error.message;
  } finally {
    // Always re-enable the form, even if the request blew up.
    inputEl.disabled = false;
    sendEl.disabled = false;
    inputEl.focus();
  }
});
</script>
</body>
</html>
